server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: local-exchange-app

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    circuitbreaker:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:dev}
  prometheus:
    metrics:
      export:
        step: 1m
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.localexchange: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30
